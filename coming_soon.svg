<svg width="800" height="110" viewBox="0 0 600 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0e1c"/>
      <stop offset="45%" stop-color="#2b1220"/>
      <stop offset="100%" stop-color="#1a0e1c"/>
    </linearGradient>

    <linearGradient id="shade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff82aa" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffbed2" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffbed2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff82aa" stop-opacity="0"/>
      <animate attributeName="x1" values="-60%;60%;-60%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="40%;160%;40%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="petalFill" cx="35%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="45%" stop-color="#ffc2d6"/>
      <stop offset="100%" stop-color="#e8749e"/>
    </radialGradient>

    <g id="petal">
      <path d="M0,10
               C -6,6 -7,-1 -4,-6
               C -2.5,-8.5 -1,-9.5 0,-11
               C 1,-9.5 2.5,-8.5 4,-6
               C 7,-1 6,6 0,10 Z
               M0,-11 L -1.6,-7.5 L 0,-8.6 L 1.6,-7.5 Z"
            fill="url(#petalFill)" stroke="#d9598a" stroke-width="0.3" stroke-opacity="0.4"/>
      <path d="M0,9 C -0.5,4 -0.3,-3 0,-9" stroke="#d9598a" stroke-width="0.4" stroke-opacity="0.35" fill="none"/>
    </g>

    <clipPath id="frame">
      <rect x="0" y="0" width="600" height="110" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="600" height="110" fill="url(#bg)"/>
    <rect x="0" y="0" width="600" height="110" fill="url(#shade)" style="mix-blend-mode:screen"/>

    <text x="300" y="50" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="17" fill="#f4a9c3">More projects coming soon.</text>
    <text x="300" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12" fill="#e9b8cd" opacity="0.85">stay tuned.</text>

    <!-- falling petals -->
    <g transform="translate(26.7,0) scale(0.56)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 13.3,125" dur="7s" begin="0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;320" dur="3.3s" begin="0s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(73.3,0) scale(0.41)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -16.7,125" dur="9s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;200" dur="5.2s" begin="1.2s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(120.0,0) scale(0.39)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 10.0,125" dur="6.5s" begin="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;260" dur="3.1s" begin="2.4s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(166.7,0) scale(0.56)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -13.3,125" dur="8s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;380" dur="3.7s" begin="0.6s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(213.3,0) scale(0.55)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 20.0,125" dur="7.5s" begin="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;260" dur="4.6s" begin="3s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(260.0,0) scale(0.47)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -10.0,125" dur="9.5s" begin="1.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;260" dur="6.5s" begin="1.8s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(306.7,0) scale(0.47)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 13.3,125" dur="6.8s" begin="4.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;380" dur="2.9s" begin="4.2s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(353.3,0) scale(0.63)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -20.0,125" dur="8.2s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;-200" dur="5.1s" begin="0.3s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(400.0,0) scale(0.54)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 12.0,125" dur="7.2s" begin="2.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;-200" dur="4.1s" begin="2.1s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(446.7,0) scale(0.62)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -14.7,125" dur="9.1s" begin="3.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;-260" dur="5.6s" begin="3.6s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(493.3,0) scale(0.39)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 16.7,125" dur="6.3s" begin="1.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;320" dur="4.4s" begin="1.5s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(533.3,0) scale(0.63)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -12.0,125" dur="8.7s" begin="4.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;380" dur="4.2s" begin="4.8s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(573.3,0) scale(0.56)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 14.7,125" dur="7.9s" begin="0.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;-260" dur="4.0s" begin="0.9s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(46.7,0) scale(0.44)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -8.0,125" dur="10s" begin="5.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;-200" dur="5.8s" begin="5.5s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(146.7,0) scale(0.42)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 18.7,125" dur="6.9s" begin="6.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;260" dur="3.7s" begin="6.2s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(273.3,0) scale(0.46)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -10.7,125" dur="8.4s" begin="2.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;320" dur="5.5s" begin="2.9s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(386.7,0) scale(0.61)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; 16.0,125" dur="7.1s" begin="5.9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;200" dur="4.6s" begin="5.9s" repeatCount="indefinite" additive="sum"/></use></g>
    <g transform="translate(500.0,0) scale(0.49)"><use href="#petal" x="0" y="0"><animateTransform attributeName="transform" type="translate" values="0,-10.0; -13.3,125" dur="9.3s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="rotate" values="0;260" dur="6.3s" begin="1.1s" repeatCount="indefinite" additive="sum"/></use></g>
  </g>

  <rect x="0.5" y="0.5" width="599" height="109" rx="10" fill="none" stroke="#f4a9c3" stroke-opacity="0.15"/>
</svg>
