<svg width="60" height="70" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#E88AA0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0 0; 0 8; 0 0" dur="1.4s" repeatCount="indefinite"/>

    <!-- faint trailing chevron above, fades out -->
    <path d="M20 10 L30 22 L40 10" fill="none" stroke="url(#arrowGrad)"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>

    <!-- mid chevron -->
    <path d="M18 26 L30 40 L42 26" fill="none" stroke="url(#arrowGrad)"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <!-- main bold chevron with glow -->
    <path d="M15 42 L30 58 L45 42" fill="none" stroke="url(#arrowGrad)"
          stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>